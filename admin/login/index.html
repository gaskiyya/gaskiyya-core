<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gaskiyya &middot; Platform admin sign-in</title>
  </head>
  <body>
    <main class="signin-wrap">
      <div class="signin-col">
        <header class="signin-head">
          <img class="signin-mark" src="/favicon.svg" alt="" />
          <h1>Sign in to Gaskiyya</h1>
          <p>Administration console</p>
        </header>
        <form class="card signin" id="signin">
          <label class="field">
            <span class="field-label">Username</span>
            <input name="username" autocomplete="username" autofocus required />
          </label>
          <label class="field">
            <span class="field-label">Password</span>
            <span class="pw">
              <input name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>
          <p class="notice error" role="alert" hidden></p>
          <button class="btn signin-submit" type="submit">Sign in</button>
        </form>
        <footer class="signin-foot">Access is restricted and monitored.</footer>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
