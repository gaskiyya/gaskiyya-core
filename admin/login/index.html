<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gaskiyya &middot; Platform admin sign-in</title>
  </head>
  <body>
    <div class="signin-wrap">
      <form class="card signin" id="signin">
        <div class="brand">
          <img class="brand-mark" src="/favicon.svg" alt="" />
          <div>
            <div class="brand-name">Gaskiyya</div>
            <div class="brand-sub">Platform admin</div>
          </div>
        </div>
        <p class="muted small">For Gaskiyya operations staff. Every action is recorded in the audit log.</p>
        <label class="field">
          <span class="field-label">Username</span>
          <input name="username" autocomplete="username" autofocus required />
        </label>
        <label class="field">
          <span class="field-label">Staff password</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="notice error" role="alert" hidden></p>
        <button class="btn">Sign in</button>
      </form>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
