# Checks every push and pull request; deploys main to the registry server on AWS and smoke-tests it.
# One-time setup (AWS role, server checkout, repo variables and secrets) is in docs/DEPLOYMENT.md.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The canonical and receipt tests check the TypeScript digests against packages/canonical_dart byte for byte.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/canonical_dart
      - run: pnpm typecheck
      - run: pnpm exec eslint .
      - run: pnpm exec vitest run --exclude tests/languages.test.ts
      - name: Tests against a real MongoDB
        run: GASKIYA_TEST_STORE=mongo pnpm exec vitest run --exclude tests/languages.test.ts
      - name: Translation coverage (reported, does not block deploys)
        continue-on-error: true
        run: pnpm exec vitest run tests/languages.test.ts

  mobile:
    name: Mobile app analyze, test and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  deploy:
    name: Deploy to the registry server
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # The AWS Free plan blocks GitHub OIDC, so this uses the gaskiyya-github-deploy IAM user, which may only send SSM commands to the server.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and swap in the new version on the server
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          GH_TOKEN: ${{ github.token }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_PRODUCTION: ${{ vars.APNS_PRODUCTION }}
        run: |
          # The job's read-only token fetches the commit; it expires when this job ends and is never stored on the server.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Settings from the production environment's secrets and variables are written into prod.env before the swap.
          # One left unset keeps whatever prod.env already has.
          env_steps=""
          put() {
            local value=$2
            # prod.env holds one line per setting: the service account JSON and the .p8 key go in as base64, which the server accepts.
            case "$value" in *$'\n'*) value=$(printf '%s' "$value" | base64 -w0) ;; esac
            local b64
            b64=$(printf '%s' "$value" | base64 -w0)
            echo "::add-mask::$b64"
            env_steps="${env_steps}sudo scripts/server-env.sh $1 $b64 && "
          }
          if [ -n "$MONGODB_URI" ]; then
            put MONGODB_URI "$MONGODB_URI"
            put STORE mongo
          fi
          # Push notifications: without the Firebase service account the server sends no pushes at all.
          for name in FCM_SERVICE_ACCOUNT_JSON APNS_KEY_P8 APNS_KEY_ID APNS_TEAM_ID APNS_BUNDLE_ID APNS_PRODUCTION; do
            if [ -n "${!name}" ]; then put "$name" "${!name}"; fi
          done
          [ -n "$FCM_SERVICE_ACCOUNT_JSON" ] || echo "::warning::FCM_SERVICE_ACCOUNT_JSON is not set in the production environment, so unless prod.env already has it the server sends no push notifications"
          script="cd /opt/gaskiyya/repo && sudo -u ubuntu git -c http.extraHeader='AUTHORIZATION: basic $auth' fetch --quiet origin main && sudo -u ubuntu git checkout --quiet --force $GITHUB_SHA && ${env_steps}sudo -u ubuntu scripts/server-deploy.sh $GITHUB_SHA"
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" --timeout-seconds 600 \
            --parameters "{\"commands\":[\"$script\"],\"executionTimeout\":[\"1500\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          while true; do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) echo "  $status";; *) break;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text | tail -20
          [ "$status" = Success ] || { echo "Deploy finished with status $status"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke test the live server
        env:
          SMOKE_ADMIN_USER: ${{ secrets.SMOKE_ADMIN_USER }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          AGENT_JOB_TOKEN: ${{ secrets.AGENT_JOB_TOKEN }}
        run: pnpm smoke "${{ vars.DEPLOY_URL }}"
