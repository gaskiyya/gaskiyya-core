name: gaskiya
description: "Check whether a message or call really came from your bank."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  receive_sharing_intent: ^1.9.0
  gaskiya_canonical:
    path: ../packages/canonical_dart
  flutter_animate: ^4.5.2
  image_picker: ^1.2.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/copy.json
    - assets/copy.pcm.json
    - assets/copy.ha.json
    - assets/copy.yo.json
    - assets/copy.ig.json
    - assets/3d/
    - assets/audio/agent/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Regular.ttf
        - asset: assets/fonts/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
