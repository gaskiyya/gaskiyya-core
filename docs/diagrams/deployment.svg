<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1200 470" role="img" aria-labelledby="deployment-title deployment-desc">
<title id="deployment-title">Deployment options</title>
<desc id="deployment-desc">Bank-hosted runs inside one bank environment. A shared service keeps a separate key and separate data for every bank.</desc>
<style>.bg{fill:#ffffff}
.lane{stroke-width:1}
.lane-bank{fill:#f3f5f8;stroke:#d8dee6}
.lane-gk{fill:#eef8f3;stroke:#bfe3d1}
.lane-cust{fill:#fbf6ee;stroke:#ecdcc0}
.lane-plain{fill:#f6f6f3;stroke:#e1e1da}
.lane-label{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.lane-label.bank{fill:#4a5a6e}.lane-label.gk{fill:#0a7a55}.lane-label.cust{fill:#9a6a1c}.lane-label.plain{fill:#6b716d}
.node{fill:#ffffff;stroke:#c9d0d8;stroke-width:1.2}
.node.gk{stroke:#0a7a55;stroke-width:1.5}
.node.cust{stroke:#d9a441}
.node.bank{stroke:#8494a7}
.node.muted{fill:#f7f7f5;stroke:#c9ccc8;stroke-dasharray:4 3}
.node.good{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1.5}
.node.warn{fill:#fff4e5;stroke:#d9890b;stroke-width:1.5}
.node.bad{fill:#fdecea;stroke:#c8372d;stroke-width:1.5}
.node.dec{fill:#ffffff;stroke:#4a5a6e;stroke-width:1.3}
.t{font:600 13.5px Inter,system-ui,sans-serif;fill:#0e1512}
.ts{font:400 11.5px Inter,system-ui,sans-serif;fill:#59645e}
.tm{font:500 11px "SF Mono",Menlo,Consolas,monospace;fill:#0e1512}
.edge{fill:none;stroke:#3d4843;stroke-width:1.4}
.edge.gk{stroke:#0a7a55}
.edge.dash{stroke-dasharray:5 4}
.edge.soft{stroke:#9aa39e}
.arrow{fill:#3d4843}.arrow.gk{fill:#0a7a55}.arrow.soft{fill:#9aa39e}
.el{font:500 11px Inter,system-ui,sans-serif;fill:#26302b}
.elb{fill:#ffffff;opacity:.94}
.step{fill:#0a7a55}
.stepn{font:700 10.5px Inter,system-ui,sans-serif;fill:#ffffff}
.life{stroke:#b9c0bc;stroke-width:1.2;stroke-dasharray:3 4}
.act{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1}
.note{fill:#fffaf0;stroke:#e6cf9c}
.cap{font:400 11px Inter,system-ui,sans-serif;fill:#6b716d}</style>
<defs><marker id="deployment-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="deployment-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="deployment-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="deployment-gk-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="deployment-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker><marker id="deployment-soft-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="470"/>
<rect class="lane lane-plain" x="20" y="20" width="570" height="430" rx="16"/>
<text class="t" x="40" y="50" text-anchor="start">Bank-hosted</text>
<text class="ts" x="40" y="68" text-anchor="start">Simplest route through security review and data residency</text>
<rect class="lane lane-bank" x="40" y="92" width="530" height="250" rx="14"/>
<text class="lane-label bank" x="58" y="116" text-anchor="start">Bank's cloud or data centre</text>
<rect class="node bank" x="60" y="136" width="180" height="62" rx="10"/>
<text class="t" x="150" y="164" text-anchor="middle">API gateway</text>
<text class="ts" x="150" y="180" text-anchor="middle">mTLS, IP allowlist</text>
<rect class="node gk" x="370" y="136" width="180" height="62" rx="10"/>
<text class="t" x="460" y="164" text-anchor="middle">Gaskiyya</text>
<text class="ts" x="460" y="180" text-anchor="middle">registry and APIs</text>
<path class="node gk" d="M370 245 a90 9 0 0 1 180 0 v58 a90 9 0 0 1 -180 0 Z"/><path class="node gk" style="fill:none" d="M370 245 a90 9 0 0 0 180 0"/>
<text class="t" x="460" y="275.5" text-anchor="middle">Registry store</text>
<text class="ts" x="460" y="291.5" text-anchor="middle">bank database</text>
<rect class="node bank" x="196" y="244" width="140" height="62" rx="10"/>
<text class="t" x="266" y="272" text-anchor="middle">Bank KMS</text>
<text class="ts" x="266" y="288" text-anchor="middle">hashing key</text>
<path class="edge " d="M240 167 L370 167" marker-end="url(#deployment-ink)"/>
<path class="edge " d="M460 198 L460 236" marker-end="url(#deployment-ink)"/>
<path class="edge soft dash" d="M370 184 L266 184 L266 244" marker-end="url(#deployment-soft)"/>
<rect class="node bank" x="60" y="362" width="180" height="62" rx="10"/>
<text class="t" x="150" y="390" text-anchor="middle">Bank systems</text>
<text class="ts" x="150" y="406" text-anchor="middle">notify, dial, sign</text>
<rect class="node cust" x="370" y="362" width="180" height="62" rx="10"/>
<text class="t" x="460" y="390" text-anchor="middle">Customers</text>
<text class="ts" x="460" y="406" text-anchor="middle">app and WhatsApp</text>
<path class="edge " d="M100 362 L100 198" marker-end="url(#deployment-ink)"/>
<path class="edge " d="M460 362 L460 312" marker-end="url(#deployment-ink)"/>
<rect class="lane lane-plain" x="610" y="20" width="570" height="430" rx="16"/>
<text class="t" x="630" y="50" text-anchor="start">Shared service</text>
<text class="ts" x="630" y="68" text-anchor="start">One deployment serves several banks, kept apart by tenant</text>
<rect class="lane lane-gk" x="630" y="92" width="530" height="250" rx="14"/>
<text class="lane-label gk" x="648" y="116" text-anchor="start">Gaskiyya shared deployment</text>
<rect class="node gk" x="800" y="132" width="190" height="56" rx="10"/>
<text class="t" x="895" y="157" text-anchor="middle">Gaskiyya APIs</text>
<text class="ts" x="895" y="173" text-anchor="middle">tenant from credentials</text>
<rect class="node gk" x="652" y="214" width="236" height="108" rx="10"/>
<text class="t" x="770" y="250" text-anchor="middle">Tenant: Bank A</text>
<text class="ts" x="770" y="266" text-anchor="middle">own hashing key</text>
<text class="ts" x="770" y="281" text-anchor="middle">own records</text>
<text class="ts" x="770" y="296" text-anchor="middle">own OAuth clients</text>
<rect class="node gk" x="902" y="214" width="236" height="108" rx="10"/>
<text class="t" x="1020" y="250" text-anchor="middle">Tenant: Bank B</text>
<text class="ts" x="1020" y="266" text-anchor="middle">own hashing key</text>
<text class="ts" x="1020" y="281" text-anchor="middle">own records</text>
<text class="ts" x="1020" y="296" text-anchor="middle">own OAuth clients</text>
<rect class="node bank" x="652" y="362" width="236" height="62" rx="10"/>
<text class="t" x="770" y="390" text-anchor="middle">Bank A and Bank B systems</text>
<text class="ts" x="770" y="406" text-anchor="middle">each with its own client</text>
<rect class="node cust" x="902" y="362" width="236" height="62" rx="10"/>
<text class="t" x="1020" y="390" text-anchor="middle">Customers of any</text>
<text class="ts" x="1020" y="406" text-anchor="middle">enrolled bank</text>
<path class="edge " d="M770 362 L770 342" marker-end="url(#deployment-ink)"/>
<path class="edge " d="M1020 362 L1020 342" marker-end="url(#deployment-ink)"/>
<path class="edge " d="M855 188 L855 200 L770 200 L770 214" marker-end="url(#deployment-ink)"/>
<path class="edge " d="M935 188 L935 200 L1020 200 L1020 214" marker-end="url(#deployment-ink)"/>
<rect class="elb" x="247.68" y="204" width="36.64" height="22" rx="6"/>
<text class="el" x="266" y="218" text-anchor="middle">HMAC</text>
</svg>
