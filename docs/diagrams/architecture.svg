<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1200 790" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Gaskiyya system architecture</title>
<desc id="architecture-desc">Bank systems call the bank-facing API. Customer channels call the customer API. The bank delivers its messages exactly as before, outside Gaskiyya.</desc>
<style>.bg{fill:#ffffff}
.lane{stroke-width:1}
.lane-bank{fill:#f3f5f8;stroke:#d8dee6}
.lane-gk{fill:#eef8f3;stroke:#bfe3d1}
.lane-cust{fill:#fbf6ee;stroke:#ecdcc0}
.lane-plain{fill:#f6f6f3;stroke:#e1e1da}
.lane-label{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.lane-label.bank{fill:#4a5a6e}.lane-label.gk{fill:#0a7a55}.lane-label.cust{fill:#9a6a1c}.lane-label.plain{fill:#6b716d}
.node{fill:#ffffff;stroke:#c9d0d8;stroke-width:1.2}
.node.gk{stroke:#0a7a55;stroke-width:1.5}
.node.cust{stroke:#d9a441}
.node.bank{stroke:#8494a7}
.node.muted{fill:#f7f7f5;stroke:#c9ccc8;stroke-dasharray:4 3}
.node.good{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1.5}
.node.warn{fill:#fff4e5;stroke:#d9890b;stroke-width:1.5}
.node.bad{fill:#fdecea;stroke:#c8372d;stroke-width:1.5}
.node.dec{fill:#ffffff;stroke:#4a5a6e;stroke-width:1.3}
.t{font:600 13.5px Inter,system-ui,sans-serif;fill:#0e1512}
.ts{font:400 11.5px Inter,system-ui,sans-serif;fill:#59645e}
.tm{font:500 11px "SF Mono",Menlo,Consolas,monospace;fill:#0e1512}
.edge{fill:none;stroke:#3d4843;stroke-width:1.4}
.edge.gk{stroke:#0a7a55}
.edge.dash{stroke-dasharray:5 4}
.edge.soft{stroke:#9aa39e}
.arrow{fill:#3d4843}.arrow.gk{fill:#0a7a55}.arrow.soft{fill:#9aa39e}
.el{font:500 11px Inter,system-ui,sans-serif;fill:#26302b}
.elb{fill:#ffffff;opacity:.94}
.step{fill:#0a7a55}
.stepn{font:700 10.5px Inter,system-ui,sans-serif;fill:#ffffff}
.life{stroke:#b9c0bc;stroke-width:1.2;stroke-dasharray:3 4}
.act{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1}
.note{fill:#fffaf0;stroke:#e6cf9c}
.cap{font:400 11px Inter,system-ui,sans-serif;fill:#6b716d}</style>
<defs><marker id="architecture-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="architecture-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="architecture-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="architecture-gk-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="architecture-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker><marker id="architecture-soft-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="790"/>
<rect class="lane lane-bank" x="20" y="20" width="1160" height="150" rx="16"/>
<text class="lane-label bank" x="38" y="46" text-anchor="start">Bank systems</text>
<rect class="lane lane-gk" x="242" y="200" width="938" height="420" rx="16"/>
<text class="lane-label gk" x="262" y="312" text-anchor="start">Gaskiyya platform</text>
<rect class="lane lane-cust" x="20" y="640" width="1160" height="130" rx="16"/>
<text class="lane-label cust" x="38" y="666" text-anchor="start">Customer</text>
<rect class="node bank" x="30" y="60" width="212" height="84" rx="10"/>
<text class="t" x="136" y="91.5" text-anchor="middle">Message gateway</text>
<text class="ts" x="136" y="107.5" text-anchor="middle">SMS and WhatsApp,</text>
<text class="ts" x="136" y="122.5" text-anchor="middle">delivers with no change</text>
<rect class="node bank" x="262" y="60" width="212" height="84" rx="10"/>
<text class="t" x="368" y="91.5" text-anchor="middle">Notification service</text>
<text class="ts" x="368" y="107.5" text-anchor="middle">Composes alerts, OTPs</text>
<text class="ts" x="368" y="122.5" text-anchor="middle">and notices</text>
<rect class="node bank" x="494" y="60" width="212" height="84" rx="10"/>
<text class="t" x="600" y="91.5" text-anchor="middle">Contact centre</text>
<text class="ts" x="600" y="107.5" text-anchor="middle">Dialler and</text>
<text class="ts" x="600" y="122.5" text-anchor="middle">agent screen</text>
<rect class="node bank" x="726" y="60" width="212" height="84" rx="10"/>
<text class="t" x="832" y="91.5" text-anchor="middle">Mobile banking backend</text>
<text class="ts" x="832" y="107.5" text-anchor="middle">Signs customer tokens,</text>
<text class="ts" x="832" y="122.5" text-anchor="middle">publishes its JWKS</text>
<rect class="node bank" x="958" y="60" width="212" height="84" rx="10"/>
<text class="t" x="1064" y="91.5" text-anchor="middle">Fraud desk</text>
<text class="ts" x="1064" y="107.5" text-anchor="middle">Console, API and</text>
<text class="ts" x="1064" y="122.5" text-anchor="middle">alert emails</text>
<rect class="node gk" x="262" y="236" width="908" height="50" rx="10"/>
<text class="t" x="716" y="258" text-anchor="middle">Bank-facing API</text>
<text class="ts" x="716" y="274" text-anchor="middle">OAuth 2.0 client credentials, mutual TLS and IP allowlist at the gateway</text>
<rect class="node gk" x="262" y="326" width="212" height="92" rx="10"/>
<text class="t" x="368" y="354" text-anchor="middle">Key service</text>
<text class="ts" x="368" y="370" text-anchor="middle">HMAC-SHA-256,</text>
<text class="ts" x="368" y="385" text-anchor="middle">one key per bank,</text>
<text class="ts" x="368" y="400" text-anchor="middle">held apart from data</text>
<path class="node gk" d="M494 335 a106 9 0 0 1 212 0 v74 a106 9 0 0 1 -212 0 Z"/><path class="node gk" style="fill:none" d="M494 335 a106 9 0 0 0 212 0"/>
<text class="t" x="600" y="366" text-anchor="middle">Registry store</text>
<text class="ts" x="600" y="382" text-anchor="middle">Keyed hashes and</text>
<text class="ts" x="600" y="397" text-anchor="middle">descriptive fields only</text>
<rect class="node gk" x="726" y="326" width="212" height="92" rx="10"/>
<text class="t" x="832" y="354" text-anchor="middle">Verdict engine</text>
<text class="ts" x="832" y="370" text-anchor="middle">One pure function,</text>
<text class="ts" x="832" y="385" text-anchor="middle">exact match only,</text>
<text class="ts" x="832" y="400" text-anchor="middle">fails closed</text>
<rect class="node gk" x="958" y="326" width="212" height="92" rx="10"/>
<text class="t" x="1064" y="361.5" text-anchor="middle">Call sessions</text>
<text class="ts" x="1064" y="377.5" text-anchor="middle">Four-digit code,</text>
<text class="ts" x="1064" y="392.5" text-anchor="middle">180 s to answer</text>
<rect class="node gk" x="262" y="434" width="212" height="92" rx="10"/>
<text class="t" x="368" y="469.5" text-anchor="middle">Notice delivery</text>
<text class="ts" x="368" y="485.5" text-anchor="middle">FCM push and</text>
<text class="ts" x="368" y="500.5" text-anchor="middle">live event stream</text>
<rect class="node gk" x="494" y="434" width="212" height="92" rx="10"/>
<text class="t" x="600" y="469.5" text-anchor="middle">Verification log</text>
<text class="ts" x="600" y="485.5" text-anchor="middle">Verdict counts and</text>
<text class="ts" x="600" y="500.5" text-anchor="middle">coverage metrics</text>
<rect class="node gk" x="726" y="434" width="212" height="92" rx="10"/>
<text class="t" x="832" y="469.5" text-anchor="middle">AI service</text>
<text class="ts" x="832" y="485.5" text-anchor="middle">Explains, reads screenshots,</text>
<text class="ts" x="832" y="500.5" text-anchor="middle">never decides</text>
<rect class="node gk" x="958" y="434" width="212" height="92" rx="10"/>
<text class="t" x="1064" y="469.5" text-anchor="middle">Campaign agent</text>
<text class="ts" x="1064" y="485.5" text-anchor="middle">Groups reported fakes,</text>
<text class="ts" x="1064" y="500.5" text-anchor="middle">drafts advisories</text>
<rect class="node gk" x="262" y="548" width="908" height="50" rx="10"/>
<text class="t" x="716" y="570" text-anchor="middle">Customer API</text>
<text class="ts" x="716" y="586" text-anchor="middle">Bank-signed customer token, 30 checks per minute per customer</text>
<rect class="node cust" x="30" y="676" width="212" height="76" rx="10"/>
<text class="t" x="136" y="703.5" text-anchor="middle">Phone inbox</text>
<text class="ts" x="136" y="719.5" text-anchor="middle">SMS and WhatsApp</text>
<text class="ts" x="136" y="734.5" text-anchor="middle">messages arrive here</text>
<rect class="node cust" x="262" y="676" width="212" height="76" rx="10"/>
<text class="t" x="368" y="703.5" text-anchor="middle">Bank app or Gaskiyya app</text>
<text class="ts" x="368" y="719.5" text-anchor="middle">Customer shares a message;</text>
<text class="ts" x="368" y="734.5" text-anchor="middle">fingerprinted on the device</text>
<rect class="node cust" x="494" y="676" width="212" height="76" rx="10"/>
<text class="t" x="600" y="703.5" text-anchor="middle">WhatsApp bot</text>
<text class="ts" x="600" y="719.5" text-anchor="middle">Paste text or</text>
<text class="ts" x="600" y="734.5" text-anchor="middle">send a screenshot</text>
<rect class="node cust muted" x="726" y="676" width="212" height="76" rx="10"/>
<text class="t" x="832" y="703.5" text-anchor="middle">USSD menu</text>
<text class="ts" x="832" y="719.5" text-anchor="middle">Planned: calls and</text>
<text class="ts" x="832" y="734.5" text-anchor="middle">today's activity</text>
<path class="edge " d="M262 102 L242 102" marker-end="url(#architecture-ink)"/>
<path class="edge soft dash" d="M136 144 L136 676" marker-end="url(#architecture-soft)"/>
<path class="edge " d="M242 714 L262 714" marker-end="url(#architecture-ink)"/>
<path class="edge " d="M368 144 L368 236" marker-end="url(#architecture-ink)"/>
<path class="edge " d="M600 144 L600 236" marker-end="url(#architecture-ink)"/>
<path class="edge soft dash" d="M832 236 L832 144" marker-end="url(#architecture-soft)"/>
<path class="edge " d="M1064 144 L1064 236" marker-end="url(#architecture-ink)" marker-start="url(#architecture-ink-s)"/>
<path class="edge " d="M368 676 L368 598" marker-end="url(#architecture-ink)" marker-start="url(#architecture-ink-s)"/>
<path class="edge " d="M600 676 L600 598" marker-end="url(#architecture-ink)" marker-start="url(#architecture-ink-s)"/>
<rect class="elb" x="68.39999999999999" y="386" width="135.20000000000002" height="48" rx="6"/>
<text class="el" x="136" y="400" text-anchor="middle">Delivered as normal.</text>
<text class="el" x="136" y="414" text-anchor="middle">Gaskiyya is not</text>
<text class="el" x="136" y="428" text-anchor="middle">in this path.</text>
<rect class="elb" x="293.56" y="180" width="148.88" height="22" rx="6"/>
<text class="tm" x="381" y="194" text-anchor="middle">POST /v1/messages</text>
<circle class="step" cx="306.56" cy="191" r="10"/><text class="stepn" x="306.56" y="194.7" text-anchor="middle">1</text>
<rect class="elb" x="534.8" y="180" width="130.4" height="22" rx="6"/>
<text class="tm" x="613" y="194" text-anchor="middle">POST /v1/calls</text>
<circle class="step" cx="547.8" cy="191" r="10"/><text class="stepn" x="547.8" y="194.7" text-anchor="middle">2</text>
<rect class="elb" x="789.04" y="180" width="85.92" height="22" rx="6"/>
<text class="el" x="832" y="194" text-anchor="middle">Fetches JWKS</text>
<rect class="elb" x="1030.28" y="180" width="67.44" height="22" rx="6"/>
<text class="el" x="1064" y="194" text-anchor="middle">Campaigns</text>
<rect class="elb" x="299.72" y="627" width="136.56" height="22" rx="6"/>
<text class="el" x="381" y="641" text-anchor="middle">Digest and token</text>
<circle class="step" cx="312.72" cy="638" r="10"/><text class="stepn" x="312.72" y="641.7" text-anchor="middle">3</text>
<rect class="elb" x="572.44" y="627" width="55.120000000000005" height="22" rx="6"/>
<text class="el" x="600" y="641" text-anchor="middle">Webhook</text>
</svg>
