<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1200 716" role="img" aria-labelledby="call-flow-title call-flow-desc">
<title id="call-flow-title">Call verification</title>
<desc id="call-flow-desc">The contact centre announces a call before dialling. The customer sees the same four-digit code the agent reads aloud.</desc>
<style>.bg{fill:#ffffff}
.lane{stroke-width:1}
.lane-bank{fill:#f3f5f8;stroke:#d8dee6}
.lane-gk{fill:#eef8f3;stroke:#bfe3d1}
.lane-cust{fill:#fbf6ee;stroke:#ecdcc0}
.lane-plain{fill:#f6f6f3;stroke:#e1e1da}
.lane-label{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.lane-label.bank{fill:#4a5a6e}.lane-label.gk{fill:#0a7a55}.lane-label.cust{fill:#9a6a1c}.lane-label.plain{fill:#6b716d}
.node{fill:#ffffff;stroke:#c9d0d8;stroke-width:1.2}
.node.gk{stroke:#0a7a55;stroke-width:1.5}
.node.cust{stroke:#d9a441}
.node.bank{stroke:#8494a7}
.node.muted{fill:#f7f7f5;stroke:#c9ccc8;stroke-dasharray:4 3}
.node.good{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1.5}
.node.warn{fill:#fff4e5;stroke:#d9890b;stroke-width:1.5}
.node.bad{fill:#fdecea;stroke:#c8372d;stroke-width:1.5}
.node.dec{fill:#ffffff;stroke:#4a5a6e;stroke-width:1.3}
.t{font:600 13.5px Inter,system-ui,sans-serif;fill:#0e1512}
.ts{font:400 11.5px Inter,system-ui,sans-serif;fill:#59645e}
.tm{font:500 11px "SF Mono",Menlo,Consolas,monospace;fill:#0e1512}
.edge{fill:none;stroke:#3d4843;stroke-width:1.4}
.edge.gk{stroke:#0a7a55}
.edge.dash{stroke-dasharray:5 4}
.edge.soft{stroke:#9aa39e}
.arrow{fill:#3d4843}.arrow.gk{fill:#0a7a55}.arrow.soft{fill:#9aa39e}
.el{font:500 11px Inter,system-ui,sans-serif;fill:#26302b}
.elb{fill:#ffffff;opacity:.94}
.step{fill:#0a7a55}
.stepn{font:700 10.5px Inter,system-ui,sans-serif;fill:#ffffff}
.life{stroke:#b9c0bc;stroke-width:1.2;stroke-dasharray:3 4}
.act{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1}
.note{fill:#fffaf0;stroke:#e6cf9c}
.cap{font:400 11px Inter,system-ui,sans-serif;fill:#6b716d}</style>
<defs><marker id="call-flow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="call-flow-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="call-flow-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="call-flow-gk-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="call-flow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker><marker id="call-flow-soft-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="716"/>
<rect class="node bank" x="75" y="24" width="210" height="58" rx="10"/>
<text class="t" x="180" y="50" text-anchor="middle">Contact centre</text>
<text class="ts" x="180" y="66" text-anchor="middle">Dialler and agent</text>
<line class="life" x1="180" y1="82" x2="180" y2="646"/>
<rect class="node gk" x="355" y="24" width="210" height="58" rx="10"/>
<text class="t" x="460" y="50" text-anchor="middle">Gaskiyya registry</text>
<text class="ts" x="460" y="66" text-anchor="middle">Call sessions</text>
<line class="life" x1="460" y1="82" x2="460" y2="646"/>
<rect class="node cust" x="635" y="24" width="210" height="58" rx="10"/>
<text class="t" x="740" y="50" text-anchor="middle">Customer app</text>
<text class="ts" x="740" y="66" text-anchor="middle">Push and live events</text>
<line class="life" x1="740" y1="82" x2="740" y2="646"/>
<rect class="node cust" x="915" y="24" width="210" height="58" rx="10"/>
<text class="t" x="1020" y="50" text-anchor="middle">Customer</text>
<text class="ts" x="1020" y="66" text-anchor="middle">On the phone</text>
<line class="life" x1="1020" y1="82" x2="1020" y2="646"/>
<path class="edge " d="M184 124 L454 124" marker-end="url(#call-flow-ink)"/>
<rect class="note" x="448" y="146" width="175.52" height="40" rx="8"/>
<text class="el" x="478" y="163" text-anchor="start">Open session, random</text>
<text class="el" x="478" y="177" text-anchor="start">four-digit code, 180 s</text>
<path class="edge soft dash" d="M456 222 L186 222" marker-end="url(#call-flow-soft)"/>
<path class="edge gk" d="M464 268 L734 268" marker-end="url(#call-flow-gk)"/>
<rect class="note" x="168" y="290" width="150.88" height="40" rx="8"/>
<text class="el" x="198" y="307" text-anchor="start">Agent screen shows</text>
<text class="el" x="198" y="321" text-anchor="start">the same code</text>
<path class="edge  dash" d="M184 366 L1014 366" marker-end="url(#call-flow-ink)"/>
<path class="edge " d="M184 412 L1014 412" marker-end="url(#call-flow-ink)"/>
<rect class="note" x="1002.96" y="434" width="157.04000000000002" height="40" rx="8"/>
<text class="el" x="1032.96" y="451" text-anchor="start">Compares it with</text>
<text class="el" x="1032.96" y="465" text-anchor="start">the code in the app</text>
<path class="edge " d="M184 510 L454 510" marker-end="url(#call-flow-ink)"/>
<path class="edge " d="M184 556 L454 556" marker-end="url(#call-flow-ink)"/>
<path class="edge gk" d="M464 602 L734 602" marker-end="url(#call-flow-gk)"/>
<text class="cap" x="600" y="670" text-anchor="middle">With no open session, the app tells the customer that their bank is not calling them.</text>
<rect class="elb" x="216.76" y="90" width="206.48000000000002" height="31" rx="5"/>
<text class="tm" x="331" y="102" text-anchor="middle">POST /v1/calls</text>
<text class="el" x="331" y="115" text-anchor="middle">recipient, purpose, agentRef</text>
<circle class="step" cx="227.76" cy="104.5" r="10"/><text class="stepn" x="227.76" y="108.2" text-anchor="middle">1</text>
<circle class="step" cx="463" cy="166" r="10"/><text class="stepn" x="463" y="169.7" text-anchor="middle">2</text>
<rect class="elb" x="232.16" y="201" width="175.68" height="18" rx="5"/>
<text class="el" x="331" y="213" text-anchor="middle">201 id, code, expiresAt</text>
<circle class="step" cx="243.16" cy="209" r="10"/><text class="stepn" x="243.16" y="212.7" text-anchor="middle">3</text>
<rect class="elb" x="515.24" y="234" width="169.52" height="31" rx="5"/>
<text class="el" x="611" y="246" text-anchor="middle">Notice: your bank is</text>
<text class="el" x="611" y="259" text-anchor="middle">calling, with the code</text>
<circle class="step" cx="526.24" cy="248.5" r="10"/><text class="stepn" x="526.24" y="252.2" text-anchor="middle">4</text>
<circle class="step" cx="183" cy="310" r="10"/><text class="stepn" x="183" y="313.7" text-anchor="middle">5</text>
<rect class="elb" x="469.03999999999996" y="345" width="261.92" height="18" rx="5"/>
<text class="el" x="611" y="357" text-anchor="middle">Phone call. Caller ID is not trusted.</text>
<circle class="step" cx="480.03999999999996" cy="353" r="10"/><text class="stepn" x="480.03999999999996" y="356.7" text-anchor="middle">6</text>
<rect class="elb" x="502.91999999999996" y="391" width="194.16000000000003" height="18" rx="5"/>
<text class="el" x="611" y="403" text-anchor="middle">Agent reads the code aloud</text>
<circle class="step" cx="513.92" cy="399" r="10"/><text class="stepn" x="513.92" y="402.7" text-anchor="middle">7</text>
<circle class="step" cx="1017.96" cy="454" r="10"/><text class="stepn" x="1017.96" y="457.7" text-anchor="middle">8</text>
<rect class="elb" x="229.07999999999998" y="476" width="181.84" height="31" rx="5"/>
<text class="tm" x="331" y="488" text-anchor="middle">PATCH /v1/calls/{id}</text>
<text class="el" x="331" y="501" text-anchor="middle">answered: kept up to 2 h</text>
<circle class="step" cx="240.07999999999998" cy="490.5" r="10"/><text class="stepn" x="240.07999999999998" y="494.2" text-anchor="middle">9</text>
<rect class="elb" x="238.32" y="522" width="163.36" height="31" rx="5"/>
<text class="tm" x="331" y="534" text-anchor="middle">PATCH /v1/calls/{id}</text>
<text class="el" x="331" y="547" text-anchor="middle">ended: closed at once</text>
<circle class="step" cx="249.32" cy="536.5" r="10"/><text class="stepn" x="249.32" y="540.2" text-anchor="middle">10</text>
<rect class="elb" x="533.72" y="581" width="132.56" height="18" rx="5"/>
<text class="el" x="611" y="593" text-anchor="middle">Notice withdrawn</text>
<circle class="step" cx="544.72" cy="589" r="10"/><text class="stepn" x="544.72" y="592.7" text-anchor="middle">11</text>
</svg>
