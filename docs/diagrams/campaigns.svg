<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 1200 362" role="img" aria-labelledby="campaigns-title campaigns-desc">
<title id="campaigns-title">Campaign detection</title>
<desc id="campaigns-desc">Reported fakes are grouped into campaigns by an agent with four tools. A fraud analyst approves every advisory. Nothing is sent to customers.</desc>
<style>.bg{fill:#ffffff}
.lane{stroke-width:1}
.lane-bank{fill:#f3f5f8;stroke:#d8dee6}
.lane-gk{fill:#eef8f3;stroke:#bfe3d1}
.lane-cust{fill:#fbf6ee;stroke:#ecdcc0}
.lane-plain{fill:#f6f6f3;stroke:#e1e1da}
.lane-label{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.lane-label.bank{fill:#4a5a6e}.lane-label.gk{fill:#0a7a55}.lane-label.cust{fill:#9a6a1c}.lane-label.plain{fill:#6b716d}
.node{fill:#ffffff;stroke:#c9d0d8;stroke-width:1.2}
.node.gk{stroke:#0a7a55;stroke-width:1.5}
.node.cust{stroke:#d9a441}
.node.bank{stroke:#8494a7}
.node.muted{fill:#f7f7f5;stroke:#c9ccc8;stroke-dasharray:4 3}
.node.good{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1.5}
.node.warn{fill:#fff4e5;stroke:#d9890b;stroke-width:1.5}
.node.bad{fill:#fdecea;stroke:#c8372d;stroke-width:1.5}
.node.dec{fill:#ffffff;stroke:#4a5a6e;stroke-width:1.3}
.t{font:600 13.5px Inter,system-ui,sans-serif;fill:#0e1512}
.ts{font:400 11.5px Inter,system-ui,sans-serif;fill:#59645e}
.tm{font:500 11px "SF Mono",Menlo,Consolas,monospace;fill:#0e1512}
.edge{fill:none;stroke:#3d4843;stroke-width:1.4}
.edge.gk{stroke:#0a7a55}
.edge.dash{stroke-dasharray:5 4}
.edge.soft{stroke:#9aa39e}
.arrow{fill:#3d4843}.arrow.gk{fill:#0a7a55}.arrow.soft{fill:#9aa39e}
.el{font:500 11px Inter,system-ui,sans-serif;fill:#26302b}
.elb{fill:#ffffff;opacity:.94}
.step{fill:#0a7a55}
.stepn{font:700 10.5px Inter,system-ui,sans-serif;fill:#ffffff}
.life{stroke:#b9c0bc;stroke-width:1.2;stroke-dasharray:3 4}
.act{fill:#e7f6ee;stroke:#0a7a55;stroke-width:1}
.note{fill:#fffaf0;stroke:#e6cf9c}
.cap{font:400 11px Inter,system-ui,sans-serif;fill:#6b716d}</style>
<defs><marker id="campaigns-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="campaigns-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow " d="M0 0 L10 5 L0 10 z"/></marker><marker id="campaigns-gk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="campaigns-gk-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow gk" d="M0 0 L10 5 L0 10 z"/></marker><marker id="campaigns-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker><marker id="campaigns-soft-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow soft" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1200" height="362"/>
<rect class="node cust" x="20" y="20" width="200" height="132" rx="10"/>
<text class="t" x="120" y="60.5" text-anchor="middle">Customer reports a fake</text>
<text class="ts" x="120" y="76.5" text-anchor="middle">Opt-in each time</text>
<text class="ts" x="120" y="91.5" text-anchor="middle">Digit runs masked</text>
<text class="ts" x="120" y="106.5" text-anchor="middle">Callback numbers</text>
<text class="ts" x="120" y="121.5" text-anchor="middle">sent as hashes</text>
<rect class="node gk" x="254" y="20" width="200" height="132" rx="10"/>
<text class="t" x="354" y="68" text-anchor="middle">Report store</text>
<text class="ts" x="354" y="84" text-anchor="middle">Masked text, embedding,</text>
<text class="ts" x="354" y="99" text-anchor="middle">link domains, keyed</text>
<text class="ts" x="354" y="114" text-anchor="middle">callback numbers</text>
<rect class="node gk" x="488" y="20" width="236" height="132" rx="10"/>
<text class="t" x="606" y="53" text-anchor="middle">Campaign agent</text>
<text class="ts" x="606" y="69" text-anchor="middle">Every 60 s, four tools:</text>
<text class="ts" x="606" y="84" text-anchor="middle">1 fetch new reports</text>
<text class="ts" x="606" y="99" text-anchor="middle">2 find similar reports</text>
<text class="ts" x="606" y="114" text-anchor="middle">3 create or update campaign</text>
<text class="ts" x="606" y="129" text-anchor="middle">4 draft an advisory</text>
<rect class="node gk" x="758" y="20" width="190" height="132" rx="10"/>
<text class="t" x="853" y="68" text-anchor="middle">Campaign</text>
<text class="ts" x="853" y="84" text-anchor="middle">status: new</text>
<text class="ts" x="853" y="99" text-anchor="middle">summary, indicators,</text>
<text class="ts" x="853" y="114" text-anchor="middle">report count</text>
<rect class="node bank" x="982" y="20" width="198" height="132" rx="10"/>
<text class="t" x="1081" y="75.5" text-anchor="middle">Fraud desk</text>
<text class="ts" x="1081" y="91.5" text-anchor="middle">Alert email and</text>
<text class="ts" x="1081" y="106.5" text-anchor="middle">console review</text>
<path class="edge " d="M220 86 L254 86" marker-end="url(#campaigns-ink)"/>
<path class="edge " d="M454 86 L488 86" marker-end="url(#campaigns-ink)"/>
<path class="edge " d="M724 86 L758 86" marker-end="url(#campaigns-ink)"/>
<path class="edge " d="M948 86 L982 86" marker-end="url(#campaigns-ink)"/>
<rect class="node good" x="760" y="210" width="200" height="76" rx="10"/>
<text class="t" x="860" y="237.5" text-anchor="middle">Approve</text>
<text class="ts" x="860" y="253.5" text-anchor="middle">status: confirmed,</text>
<text class="ts" x="860" y="268.5" text-anchor="middle">advisory approved</text>
<rect class="node muted" x="982" y="210" width="198" height="76" rx="10"/>
<text class="t" x="1081" y="245" text-anchor="middle">Dismiss</text>
<text class="ts" x="1081" y="261" text-anchor="middle">status: dismissed</text>
<path class="edge " d="M1041 152 L1041 188 L860 188 L860 210" marker-end="url(#campaigns-ink)"/>
<path class="edge " d="M1101 152 L1101 210" marker-end="url(#campaigns-ink)"/>
<rect class="node muted" x="20" y="210" width="704" height="76" rx="10"/>
<text class="t" x="372" y="237.5" text-anchor="middle">Grouping rule</text>
<text class="ts" x="372" y="253.5" text-anchor="middle">Two reports belong together when they share a link domain or a callback number,</text>
<text class="ts" x="372" y="268.5" text-anchor="middle">or their embeddings (same model) are at least 0.82 similar. Two reports start a campaign.</text>
<text class="ts" x="600" y="340" text-anchor="middle">The agent has no tool that sends anything. Whether and how to publish an approved advisory is the bank's decision.</text>
</svg>
